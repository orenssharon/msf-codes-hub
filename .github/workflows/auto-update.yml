name: Run MSF Scraper

on:
  schedule:
    - cron: '0 0 * * *' # רץ כל יום או לפי בחירתך
  workflow_dispatch: # מאפשר הפעלה ידנית ידנית

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ---> כאן מתבצע וידוא והתקנת החבילות <---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py # או שם הקובץ שלך
