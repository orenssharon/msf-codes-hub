name: Auto-Upgrade MSF Codes Hub

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run live code scraper
        run: python update_codes.py

      - name: Commit and push changes if updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update MSF codes via live community scraper"
          branch: main
